# Execução isolada. O leitor NÃO precisa de rede (lê arquivos montados somente-leitura).
services:
  leitor:
    build: { context: .., dockerfile: docker/Dockerfile, target: runtime }
    image: legna-leitor
    network_mode: none           # sem rede: processa arquivos de clientes isolado
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    volumes: ["../dados:/data:ro"]
    command: ["/data/projeto.pdf"]
  ia:                            # serviço que chama a API da Anthropic: precisa de rede e da chave
    image: legna-leitor
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
secrets:
  anthropic_api_key:
    file: ../secrets/anthropic_api_key   # arquivo local, fora do git (/secrets/ no .gitignore)
